<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161a26" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e9e2cf" media="(prefers-color-scheme: light)" />
    <script>
      // Keep in sync with src/hooks/use-theme.ts.
      ;(() => {
        try {
          const stored = window.localStorage.getItem('rzid.theme')
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Ramadhanu: software engineer, Jakarta</title>
    <meta
      name="description"
      content="Portfolio Ramadhanu, software engineer di Jakarta. Web, mobile, dan backend."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
