    <script>
      // Keep in sync with src/lib/boundary/preferences.ts.
      ;(() => {
        try {
          const theme = window.localStorage.getItem('rzid.theme')
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.dataset.theme = theme
          }
          const locale = window.localStorage.getItem('rzid.locale')
          if (locale === 'en' || locale === 'id') {
            document.documentElement.lang = locale
          }
        } catch {
          // Storage can be unavailable; keep the defaults.
        }
      })()
    </script>
