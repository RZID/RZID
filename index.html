    <meta name="theme-color" content="#161a26" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e9e2cf" media="(prefers-color-scheme: light)" />
    <script>
      // Keep in sync with src/hooks/use-theme.ts.
      ;(() => {
        try {
          const stored = window.localStorage.getItem('rzid.theme')
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          const storedLocale = window.localStorage.getItem('rzid.locale')
          const browserLocale = (window.navigator.language || '').toLowerCase()
          document.documentElement.lang =
            storedLocale === 'id' || storedLocale === 'en'
              ? storedLocale
              : browserLocale === 'id' || browserLocale === 'id-id'
                ? 'id'
                : 'en'
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <script>
      // Keep in sync with src/features/boot/boot-state.ts.
      ;(() => {
        const boot = (() => {
          try {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false
            if (window.location.hash !== '') return false
            if (new URLSearchParams(window.location.search).get('intro') === '1') return true
            return window.sessionStorage.getItem('rzid.boot') !== 'done'
          } catch {
            return true
          }
        })()
        document.documentElement.dataset.boot = boot ? '1' : '0'
      })()
    </script>

    <script>
      // Keep in sync with the gate in the head.
      ;(() => {
        const shell = document.getElementById('boot-shell')
        const button = document.getElementById('boot-start')
        const hint = document.getElementById('boot-hint')
        const bar = document.getElementById('boot-bar')

        if (shell === null || button === null || hint === null || bar === null) return

        if (document.documentElement.lang === 'id') hint.textContent = 'atau tekan Enter'

        let ready = false
        const reveal = () => {
          ready = true
          button.classList.remove('invisible')
          hint.classList.remove('invisible')
          button.focus()
        }

        const start = () => {
          if (!ready) return
          try {
            window.sessionStorage.setItem('rzid.boot', 'done')
          } catch {
            // Storage can be unavailable; the gate still closes.
          }
          document.documentElement.dataset.boot = '0'
          shell.remove()
        }

        bar.addEventListener('animationend', reveal)
        window.setTimeout(reveal, 2000)
        button.addEventListener('click', start)
        window.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') start()
        })
      })()
    </script>
